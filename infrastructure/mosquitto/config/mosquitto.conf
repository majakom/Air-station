##########################################
# TLS & AUTH SETTINGS
##########################################

# Listen for TLS connections on standard port 8883
listener 8883
protocol mqtt

# Paths to certificates
cafile /mosquitto/certificates/ca/ca.crt
certfile /mosquitto/certificates/server/server.crt
keyfile /mosquitto/certificates/server/server.key

# Only allow clients with valid certificates
require_certificate true

# Do not allow anonymous;
allow_anonymous false

# Use password file
password_file /mosquitto/config/passwd

# Use ACL fike for access control
# acl_file acl

# Use a specific TLS version
tls_version tlsv1.2

##########################################
# 2. PERSISTENCE & DATA
##########################################

persistence true
persistence_location /mosquitto/data/

##########################################
# 3. LOGGING
##########################################

log_dest file /mosquitto/log/mosquitto.log

log_type error
log_type warning
log_type notice
log_type information
log_type debug